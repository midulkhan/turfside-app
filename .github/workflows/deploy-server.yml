name: Deploy API (api.turfsides.com)

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-server.yml']
  workflow_dispatch: {}

concurrency:
  group: deploy-server
  cancel-in-progress: false # never interrupt an upload halfway

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: turfsides
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck + build single-file bundle
        run: npm run build

      - name: End-to-end tests against a throwaway database
        env:
          NODE_ENV: staging
          PORT: 4010
          PUBLIC_URL: http://localhost:4010
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/turfsides
          DB_SSL: 'false'
          JWT_SECRET: ci_jwt_secret_0123456789abcdefghijklmnop
          PASS_SECRET: ci_pass_secret_0123456789abcdefghijklmno
          OTP_SECRET: ci_otp_secret_0123456789abcdefghijklmnopq
          CRON_SECRET: ci_cron_secret_0123456789abcd
          BKASH_MODE: simulate
        run: |
          node dist/index.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4010/health > /dev/null && break; sleep 1; done
          API_URL=http://localhost:4010 npx vitest run || (cat /tmp/api.log; exit 1)

      - name: Assemble deploy folder
        run: |
          rm -rf deploy && mkdir -p deploy/dist deploy/tmp
          cp dist/index.js deploy/dist/
          cp -r public deploy/public
          # Everything is bundled into dist/index.js, so the server needs no `npm install`.
          node -e "const p=require('./package.json');require('fs').writeFileSync('deploy/package.json',JSON.stringify({name:p.name,version:p.version,private:true,main:'dist/index.js',scripts:{start:'node dist/index.js'},engines:p.engines},null,2))"
          date -u > deploy/tmp/restart.txt   # tells cPanel/Passenger to restart the app

      - name: Upload over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./server/deploy/
          # Main cPanel FTP login lands in your home folder → upload into the subdomain folder.
          # If your FTP account is already scoped to that folder, set repo variable FTP_SERVER_DIR to ./
          server-dir: ${{ vars.FTP_SERVER_DIR || './api.turfsides.com/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env*
