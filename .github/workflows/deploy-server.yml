name: Deploy API (api.turfsides.com)

on:
  push:
    branches: [main]
    # The suite also tests the app's API client against the server, so changes there count too.
    paths: ['server/**', 'src/features/api/**', '.github/workflows/deploy-server.yml']
  workflow_dispatch: {}

concurrency:
  group: deploy-server
  cancel-in-progress: false # never interrupt an upload halfway

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: turfsides
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      # The cache runs against real Redis in CI, behind a local stand-in for Upstash's REST API.
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck + build single-file bundle
        run: npm run build

      - name: End-to-end tests against a throwaway database
        env:
          NODE_ENV: staging
          PORT: 4010
          PUBLIC_URL: http://localhost:4010
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/turfsides
          DB_SSL: 'false'
          JWT_SECRET: ci_jwt_secret_0123456789abcdefghijklmnop
          PASS_SECRET: ci_pass_secret_0123456789abcdefghijklmno
          OTP_SECRET: ci_otp_secret_0123456789abcdefghijklmnopq
          CRON_SECRET: ci_cron_secret_0123456789abcd
          BKASH_MODE: simulate
          # Local S3-compatible stand-in for Cloudflare R2 (scripts/s3-local.mjs)
          R2_ENDPOINT: http://127.0.0.1:4569
          R2_ACCESS_KEY_ID: S3RVER
          R2_SECRET_ACCESS_KEY: S3RVER
          R2_BUCKET: turfsides-test
          R2_PUBLIC_URL: https://pub-test.r2.dev
          STORAGE_TEST: '1'
          AUTH_RATE_LIMIT: '1000' # the suite signs up many test users from one IP
          OTP_IP_LIMIT: '1000'
          OTP_PHONE_LIMIT: '1000'
          OTP_RESEND_SECONDS: '0'
          PUSH_DRY_RUN: 'true'
          RATE_LIMIT_PER_MIN: '10000'
          # Redis cache through scripts/upstash-local.mjs (same protocol as Upstash)
          UPSTASH_REDIS_REST_URL: http://127.0.0.1:8079
          UPSTASH_REDIS_REST_TOKEN: local-token
          CACHE_PREFIX: 'ci:'
          UPSTASH_TEST_URL: http://127.0.0.1:8079
          UPSTASH_TEST_TOKEN: local-token
          API_URL_2: http://localhost:4011
        run: |
          node scripts/s3-local.mjs /tmp/s3-local > /tmp/s3.log 2>&1 &
          node scripts/upstash-local.mjs 8079 6379 > /tmp/upstash.log 2>&1 &
          # The app-client tests compile ../src, whose tsconfig extends Expo's base config.
          # Only the server's packages are installed here, so give that file an empty stand-in.
          [ -f ../node_modules/expo/tsconfig.base.json ] || { mkdir -p ../node_modules/expo && echo '{}' > ../node_modules/expo/tsconfig.base.json; }
          node dist/index.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4010/health | grep -q '"schema":"ok"' && break; sleep 1; done
          # A second process on the same database + Redis: the cache must stay right across processes.
          PORT=4011 PUBLIC_URL=http://localhost:4011 AUTO_MIGRATE=false node dist/index.js > /tmp/api2.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4011/health > /dev/null && break; sleep 1; done
          curl -s http://localhost:4010/health | grep -q '"cache":"upstash-redis:ok"' || { echo "Redis cache not active"; curl -s http://localhost:4010/health; exit 1; }
          API_URL=http://localhost:4010 npx vitest run || (cat /tmp/api.log; tail -50 /tmp/api2.log; exit 1)

      - name: Assemble deploy folder
        run: |
          rm -rf deploy && mkdir -p deploy/dist deploy/tmp
          cp dist/index.js deploy/dist/
          cp -r public deploy/public
          # Everything is bundled into dist/index.js, so the server needs no `npm install`.
          node -e "const p=require('./package.json');require('fs').writeFileSync('deploy/package.json',JSON.stringify({name:p.name,version:p.version,private:true,main:'dist/index.js',scripts:{start:'node dist/index.js'},engines:p.engines},null,2))"
          date -u > deploy/tmp/restart.txt   # tells cPanel/Passenger to restart the app

      - name: Upload over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./server/deploy/
          # The FTP account opens directly in ~/api.turfsides.com (the app root), so upload to its root.
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env*
