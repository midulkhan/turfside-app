name: Diagnose live API
on:
  workflow_dispatch:
    inputs:
      email_test:
        description: 'Optional: an address you own. Starts a sign-up (no account is created) so a code email is sent, then prints the result.'
        required: false
        default: ''
      smtp_test:
        description: 'Optional: "yes" to log in to mail.turfsides.com:465 as noreply@ (password from the SMTP_PASSWORD secret) and send a test to noreply@ itself.'
        required: false
        default: ''
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Health + sign-up probe
        run: |
          curl -sS -m 20 https://api.turfsides.com/health; echo
          curl -sS -m 20 https://api.turfsides.com/v1/config; echo
          echo "matches:"; curl -sS -m 20 "https://api.turfsides.com/v1/matches?limit=2"; echo
          echo "explore page:"; curl -sS -m 20 "https://api.turfsides.com/v1/venues/explore?lat=23.81&lng=90.42&limit=2" | head -c 300; echo
          curl -sS -m 20 -o /dev/null -w "seed photo: HTTP %{http_code} %{content_type} %{size_download} bytes\n" https://api.turfsides.com/static/seed/venue-arena.webp
          echo "images.turfsides.com:"; curl -sS -m 20 -o /dev/null -w "HTTP %{http_code} via %{remote_ip}\n" https://images.turfsides.com/does-not-exist.webp || true
          curl -sSI -m 20 https://images.turfsides.com/does-not-exist.webp | grep -iE "^server|^cf-ray" || true
          curl -sS -m 20 https://api.turfsides.com/v1/me/places; echo
          curl -sS -m 30 "https://api.turfsides.com/v1/venues/explore?lat=23.8191&lng=90.4526" | head -c 400; echo
          curl -sS -m 30 "https://api.turfsides.com/v1/venues/v_bashundhara" | head -c 300; echo
          curl -sS -m 30 "https://api.turfsides.com/v1/venues/v_bashundhara/slots?day=$(TZ=Asia/Dhaka date +%F)" | head -c 300; echo
          curl -sS -m 20 -X POST https://api.turfsides.com/v1/auth/signup/start -H 'Content-Type: application/json' \
            -d '{"name":"Diag Test","phone":"1799999123","password":"diagnostic pass 1"}'; echo
      - uses: actions/checkout@v4
      - name: Realtime (Supabase) subscription
        run: |
          mkdir -p /tmp/rt && cp server/scripts/realtime-check.mjs /tmp/rt/ && cd /tmp/rt
          npm init -y >/dev/null && npm i --silent --no-audit --no-fund @supabase/realtime-js@2 >/dev/null
          node realtime-check.mjs https://api.turfsides.com || true
      - name: Photo uploads (Cloudflare R2) end to end
        run: node server/scripts/live-upload-check.mjs https://api.turfsides.com || true
      - name: Can the outside world reach the Supabase pooler? (rules out Supabase itself)
        run: |
          for port in 5432 6543; do timeout 8 bash -c "</dev/tcp/aws-0-ap-northeast-2.pooler.supabase.com/$port" && echo "pooler:$port reachable" || echo "pooler:$port NOT reachable"; done
      - name: Server error log (last lines)
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl -s --ssl-reqd --insecure --max-time 30 --user "$U:$P" "ftp://$S/stderr.log" -o err.log || true
          wc -c err.log || true
          tail -c 6000 err.log | grep -v -i "password\|secret" || true
      - name: Email probe (only with email_test)
        if: ${{ inputs.email_test != '' }}
        env:
          TO: ${{ inputs.email_test }}
        run: |
          PHONE="19$(shuf -i 10000000-99999999 -n 1)"
          echo "signup/start:"; curl -sS -m 30 -H 'Content-Type: application/json' -d "{\"name\":\"Email Probe\",\"phone\":\"$PHONE\",\"email\":\"$TO\",\"password\":\"probe password 1\"}" https://api.turfsides.com/v1/auth/signup/start | sed -E 's/"devCode":"[0-9]+"/"devCode":"******"/'; echo
          sleep 2
          echo "email status:"; curl -sS -m 20 https://api.turfsides.com/health | grep -oE '"email":"[^"]*","emailLastSend":(null|\{[^}]*\})'
      - name: SMTP probe (only with smtp_test)
        if: ${{ inputs.smtp_test != '' }}
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, smtplib, ssl, socket
          from email.message import EmailMessage
          from datetime import datetime, timezone
          host, user = 'mail.turfsides.com', 'noreply@turfsides.com'
          try:
              print('dns:', socket.gethostbyname(host))
              s = smtplib.SMTP_SSL(host, 465, context=ssl.create_default_context(), timeout=20)
              print('connected, TLS ok:', s.ehlo()[0])
              s.login(user, os.environ['SMTP_PASS']); print('login: ok')
              m = EmailMessage(); m['From'] = f'TurfSides <{user}>'; m['To'] = user
              m['Subject'] = 'TurfSides SMTP test ' + datetime.now(timezone.utc).strftime('%H:%M:%S UTC')
              m.set_content('If you can read this, SMTP from noreply@turfsides.com works.')
              print('send:', s.send_message(m) or 'accepted by server'); s.quit()
          except Exception as e:
              print('FAILED:', type(e).__name__, str(e)[:300])
          PY
