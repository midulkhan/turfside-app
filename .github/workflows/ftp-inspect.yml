name: FTP inspect (diagnostics)
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List FTP folders
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          for d in "" "api.turfsides.com/" "api.turfsides.com/api.turfsides.com/" "public_html/" "public_html/api.turfsides.com/"; do
            echo "===== /$d"
            curl -s --ssl-reqd --insecure --max-time 20 --user "$U:$P" "ftp://$S/$d" | awk '{print $1, $NF}' | head -40 || echo "(not found)"
          done
          echo "===== PWD"
          curl -s --ssl-reqd --insecure --max-time 20 --user "$U:$P" "ftp://$S/" -Q "PWD" -o /dev/null -v 2>&1 | grep -i '257' || true
