name: FTP cleanup (one-off)
on: workflow_dispatch
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove the copy uploaded one level too deep
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          N=api.turfsides.com
          f() { curl -s --ssl-reqd --insecure --max-time 20 --user "$U:$P" "ftp://$S/" -Q "$1" -o /dev/null && echo "ok: $1" || echo "skip: $1"; }
          for x in public/seed/venue-arena.webp public/seed/venue-dusk.webp public/seed/venue-evening.webp public/seed/venue-floodlit.webp public/seed/venue-sunset.webp dist/index.js package.json tmp/restart.txt .ftp-deploy-sync-state.json; do f "DELE $N/$x"; done
          for d in public/seed public dist tmp ""; do f "RMD $N/$d"; done
          echo "===== root now"; curl -s --ssl-reqd --insecure --user "$U:$P" "ftp://$S/" | awk '{print $1, $NF}'
