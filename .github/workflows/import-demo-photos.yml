name: Import demo turf photos (one-off)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch, compress and upload to R2
        working-directory: server/scripts/demo-photos
        run: |
          npm init -y >/dev/null && npm install --no-audit --no-fund sharp@0.34 >/dev/null
          node import.mjs https://api.turfsides.com
      - name: Save results to a review branch
        run: |
          git config user.name "turfsides-bot"; git config user.email "bot@users.noreply.github.com"
          git checkout -b demo-photos-result
          git add -f server/scripts/demo-photos/out
          git commit -m "Demo photo import results" && git push -f origin demo-photos-result
